name: Public Release (full)

on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact commit SHA that must be built
        required: true
        type: string
      tag:
        description: Release tag, e.g. v2.3.1-agent.22
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Verify immutable source
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          printf 'source_sha=%s\n' "$EXPECTED_SHA" | tee release-source.txt

      - name: Set up JDK
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2

      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: latest

      - name: Gradle cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}

      - name: Prepare build files
        env:
          KEY_BASE64: ${{ secrets.KEY_BASE64 }}
          SIGNING_CONFIG: ${{ secrets.SIGNING_CONFIG }}
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          set -euo pipefail
          test -n "$KEY_BASE64"
          test -n "$SIGNING_CONFIG"
          test -n "$GOOGLE_SERVICES_JSON"
          umask 077
          printf '%s' "$KEY_BASE64" | base64 -d > app/app.key
          printf '%s\n' "$SIGNING_CONFIG" > local.properties
          printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json
          test -s app/app.key
          grep -q '^storeFile=' local.properties
          grep -q '^storePassword=' local.properties
          grep -q '^keyAlias=' local.properties
          grep -q '^keyPassword=' local.properties
          python3 -m json.tool app/google-services.json >/dev/null

      - name: Gradle Build (all ABIs + universal)
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Verify and stage signed artifacts
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          out_dir=app/build/outputs/apk/release
          sdk_dir="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          build_tools="$(find "$sdk_dir/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          expected_cert='9dc3d0968c6546a6d93b2a036894c4ee30b167c246e0ad3bc384a93b5bce0e7b'
          mkdir -p dist
          : > SHA256SUMS
          mapfile -t apks < <(find "$out_dir" -maxdepth 1 -type f -name 'app-*-release.apk' -print)
          test "${#apks[@]}" -ge 2
          for apk in "${apks[@]}"; do
            base="$(basename "$apk")"
            abi="${base#app-}"
            abi="${abi%-release.apk}"
            final="dist/rikkahub-${TAG}-${abi}.apk"
            "$build_tools/apksigner" verify --verbose --print-certs "$apk" > cert.txt
            actual_cert="$(awk -F': ' '/certificate SHA-256 digest:/ { print $NF; exit }' cert.txt | tr -d ':' | tr '[:upper:]' '[:lower:]')"
            test "$actual_cert" = "$expected_cert"
            mv "$apk" "$final"
            sha256sum "$final" | tee -a SHA256SUMS
          done
          ls -la dist
          mv SHA256SUMS dist/SHA256SUMS

      - name: Release notes
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          TAG: ${{ inputs.tag }}
        run: |
          cat > dist/release-notes.md <<'EOF'
          ## RikkaHub Forge ${{ inputs.tag }}

          Agent-focused fork of RikkaHub: native Termux integration, hardened sub-agent orchestration, long-term memory with recall, an experimental code editor (sora-editor, TextMate highlighting, right-side file drawer), and a long list of chat UX + reliability work on top of upstream.

          ### Files
          - `*-arm64-v8a.apk` for most modern phones
          - `*-x86_64.apk` for emulators and x86 devices
          - `*-universal.apk` when in doubt

          ### Provenance
          - source: ${{ inputs.expected_sha }}
          - signer certificate sha256: `9dc3d0968c6546a6d93b2a036894c4ee30b167c246e0ad3bc384a93b5bce0e7b`
          - per-file hashes in `SHA256SUMS`
          EOF
          # expand the placeholders (heredoc above is quoted on purpose, expand manually)
          sed -i "s|\${{ inputs.tag }}|${TAG}|g; s|\${{ inputs.expected_sha }}|${EXPECTED_SHA}|g" dist/release-notes.md

      - name: Remove temporary credentials
        if: always()
        run: rm -f app/app.key local.properties app/google-services.json

      - name: Publish GitHub Release
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          gh release create "$TAG" \
            --repo "${{ github.repository }}" \
            --title "RikkaHub Forge ${TAG#v}" \
            --notes-file dist/release-notes.md \
            --latest \
            dist/*.apk dist/SHA256SUMS
